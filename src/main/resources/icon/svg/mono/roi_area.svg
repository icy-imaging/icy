<?xml version="1.0" encoding="UTF-8" standalone="no"?>

<svg
        width="64"
        height="64"
        viewBox="0 0 64 64"
        version="1.1"
        id="roi-ellipse"
        xmlns="http://www.w3.org/2000/svg">
    <pattern
            id="diagonalHatch"
            patternUnits="userSpaceOnUse"
            width="10"
            height="10">
        <line fill="none" stroke="#000" stroke-width="3"  x1="0" y1="10" x2="10" y2="0" />
        <line fill="none" stroke="#000" stroke-width="3"  x1="-2" y1="2" x2="2" y2="-2" />
        <line fill="none" stroke="#000" stroke-width="3"  x1="8" y1="12" x2="12" y2="8" />
        <!--<rect fill="#000" stroke="none" x="0" y="0" width="10" height="10" />
        <rect fill="#000" stroke="none" x="10" y="10" width="10" height="10" />-->
    </pattern>
    <g>
        <ellipse
                fill="url(#diagonalHatch)"
                stroke="#000"
                stroke-width="5"
                cx="32"
                cy="32"
                rx="26"
                ry="26"
        />
    </g>
</svg>